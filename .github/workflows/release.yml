name: Release Builds

# 每次 push 到 master 构建三平台（Linux / Windows / macOS）命令行发行包。
# 产物通过 Actions Artifacts 提供，在 Actions 页面下载。
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续 push 时取消上一次未完成的运行，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config libssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxtst-dev libxi-dev libice-dev libsm-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINPUTLEAP_BUILD_GUI=OFF \
            -DINPUTLEAP_BUILD_TESTS=OFF \
            -DINPUTLEAP_VERSION_DESC=release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Package
        run: tar -czf input-leap-linux-x86_64.tar.gz -C install .

      - uses: actions/upload-artifact@v4
        with:
          name: input-leap-linux-x86_64
          path: input-leap-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # OpenSSL 由仓库内 third_party/openssl 提供，无需外部 SDK
      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DINPUTLEAP_BUILD_GUI=OFF `
            -DINPUTLEAP_BUILD_TESTS=OFF `
            -DINPUTLEAP_VERSION_DESC=release `
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build and install
        run: cmake --build build --config Release --target install

      - name: Package
        run: Compress-Archive -Path "install\*" -DestinationPath input-leap-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: input-leap-windows-x64
          path: input-leap-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja openssl@3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINPUTLEAP_BUILD_GUI=OFF \
            -DINPUTLEAP_BUILD_TESTS=OFF \
            -DINPUTLEAP_VERSION_DESC=release \
            -DOpenSSL_ROOT="$(brew --prefix openssl@3)" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Package
        run: tar -czf input-leap-macos-arm64.tar.gz -C install .

      - uses: actions/upload-artifact@v4
        with:
          name: input-leap-macos-arm64
          path: input-leap-macos-arm64.tar.gz
          if-no-files-found: error

  # 三平台构建全部成功后，创建/更新滚动 Release（tag: latest），附上三平台包。
  # 想要“每次提交一个独立版本”，把下面的 latest 换成如 v3.0.3-$SHA 即可。
  publish:
    name: Publish Release
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          FILES=$( { find dist -type f -name '*.tar.gz'; find dist -type f -name '*.zip'; } | sort )
          echo "待发布文件："
          echo "$FILES"
          NOTES="InputLeap 命令行版最新构建

          - 提交: $SHA
          - 分支: $REF
          - 平台: Linux (x86_64) / Windows (x64) / macOS (arm64)
          - 仅命令行程序（无 Qt 界面）"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest $FILES --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "InputLeap CLI 最新构建" --notes "$NOTES" --target "$SHA" $FILES
          fi
          gh release view latest --json url,assets --jq '"发布地址: " + .url, (.assets[] | "  " + .name)'
